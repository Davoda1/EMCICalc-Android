name: Android source and host tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source contracts and host adapters
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the matching Java major
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17.0.21+9'
      - name: Run bounded source and host checks
        timeout-minutes: 8
        run: timeout 480 python3 scripts/ci_source.py

  native-host:
    name: Qt 6.10.3 host build and focused regressions
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install host build dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake ninja-build pkg-config libgmp-dev libmpfr-dev \
            libxml2-dev zlib1g-dev python3-venv libgl1-mesa-dev libegl1-mesa-dev \
            libfontconfig1-dev libdbus-1-3 libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1
      - name: Install verified Qt host archives only
        timeout-minutes: 5
        run: |
          python3 -m venv "$RUNNER_TEMP/qt-helper-venv"
          "$RUNNER_TEMP/qt-helper-venv/bin/python" -m pip install \
            --disable-pip-version-check 'aqtinstall==3.3.0' 'py7zr==1.1.3'
          "$RUNNER_TEMP/qt-helper-venv/bin/python" scripts/ci_install_host_qt.py \
            --prefix "$RUNNER_TEMP/Qt"
      - name: Compile the application and selected host fixtures
        timeout-minutes: 20
        run: timeout 1200 bash scripts/ci_native_host.sh build
      - name: Run six focused host CTest suites
        timeout-minutes: 10
        run: bash scripts/ci_native_host.sh test
      - name: Retain test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-host-tests-${{ github.sha }}
          path: |
            build-ci/ctest-results.xml
            build-ci/Testing/Temporary/LastTest.log
            build-ci/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore
          retention-days: 7
